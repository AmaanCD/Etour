# nginx.conf
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

 server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }


    server {
        listen 443 ssl;
        server_name etour.com;

         ssl_certificate /etc/nginx/ssl/etour.com;
         ssl_certificate_key /etc/nginx/ssl/etour.com.key;

        # Proxy all requests at root to the Spring Boot application
        location /auth/  {
            proxy_pass http://keycloak:7080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
             proxy_set_header X-Forwarded-Host $host;

                    # WebSocket support (for admin console)
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";

                    proxy_buffer_size 128k;
                    proxy_buffers 4 256k;
                    proxy_busy_buffers_size 256k;
        }

        # Redirect pgAdmin traffic
            location /pgadmin/ {
                proxy_set_header X-Script-Name /pgadmin;
                proxy_pass http://pgadmin:80/;
                proxy_set_header Host               $host;
                proxy_set_header X-Real-IP          $remote_addr;
                proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto  $scheme;
            }

            location /app/ {

                 proxy_pass http://app:8080/;
                 proxy_set_header Host               $host;
                 proxy_set_header X-Real-IP          $remote_addr;
                 proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
                 proxy_set_header X-Forwarded-Proto  $scheme;
            }

            location /redisinsight/ {

                 proxy_pass http://redis-insight:5540/redisinsight/;
                 proxy_set_header Host               $host;
                 proxy_set_header X-Real-IP          $remote_addr;
                 proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
                 proxy_set_header X-Forwarded-Proto  $scheme;
                  # WebSocket support


            }


    }
}
